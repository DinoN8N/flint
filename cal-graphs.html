<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Graphiques Calories</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #f8f9fc; }
    body {
      font-family: 'Archivo', -apple-system, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-header {
      width: 100%;
      max-width: 464px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 0;
      margin-bottom: 12px;
      border-bottom: 1px solid rgba(0,0,0,.05);
    }
    .modal-header button {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #14110f;
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-header h2 {
      font-size: 18px;
      font-weight: 600;
      color: #14110f;
      flex: 1;
      margin: 0;
    }
    .tabs {
      width: 100%;
      max-width: 464px;
      display: flex;
      gap: 8px;
      padding: 12px 0;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(0,0,0,.04);
      overflow-x: auto;
    }
    .tabs button {
      padding: 8px 14px;
      border: 1px solid #e0e0e0;
      background: #fff;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      font-size: 12px;
      white-space: nowrap;
      transition: all .18s;
    }
    .tabs button.active {
      background: #fff;
      border-color: #f4741a;
      color: #f4741a;
    }
    .graph-container {
      width: 100%;
      max-width: 464px;
      height: 240px;
      background: #fff;
      border-radius: 18px;
      padding: 16px;
      box-shadow: 0 1px 2px rgba(0,0,0,.03);
    }
    svg {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div class="modal-header">
    <button onclick="window.history.back()">‹</button>
    <h2>Calories</h2>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="brulee" onclick="switchTab('brulee')">Brûlées</button>
    <button class="tab-btn" data-tab="consommee" onclick="switchTab('consommee')">Consommées</button>
    <button class="tab-btn" data-tab="balance" onclick="switchTab('balance')">Balance</button>
  </div>

  <div class="graph-container">
    <svg id="graph" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid meet"></svg>
  </div>

  <script>
    const data = {
      brulee: [2200, 2350, 2100, 2450, 2300, 2500, 2150],
      consommee: [1500, 1600, 1400, 1800, 1550, 1700, 1300]
    };

    function drawGraph(tab) {
      const svg = document.getElementById('graph');
      svg.innerHTML = '';

      // Axes
      const line_x = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line_x.setAttribute('x1', '50');
      line_x.setAttribute('y1', '200');
      line_x.setAttribute('x2', '380');
      line_x.setAttribute('y2', '200');
      line_x.setAttribute('stroke', '#ececf0');
      line_x.setAttribute('stroke-width', '1');
      svg.appendChild(line_x);

      const line_y = document.createElementNS('http://www.w3.org/2000/svg', 'line');
      line_y.setAttribute('x1', '50');
      line_y.setAttribute('y1', '20');
      line_y.setAttribute('x2', '50');
      line_y.setAttribute('y2', '200');
      line_y.setAttribute('stroke', '#ececf0');
      line_y.setAttribute('stroke-width', '1');
      svg.appendChild(line_y);

      const max_val = 2600;
      const width = 380 - 50;
      const height = 200 - 20;

      function drawLine(values, color, opacity = 1) {
        let points = [];
        for (let i = 0; i < values.length; i++) {
          const x = 50 + (width * i / 6);
          const y = 200 - (values[i] / max_val) * height;
          points.push(`${x},${y}`);
        }

        const polyline = document.createElementNS('http://www.w3.org/2000/svg', 'polyline');
        polyline.setAttribute('points', points.join(' '));
        polyline.setAttribute('fill', 'none');
        polyline.setAttribute('stroke', color);
        polyline.setAttribute('stroke-width', '2.5');
        polyline.setAttribute('stroke-linejoin', 'round');
        polyline.setAttribute('stroke-linecap', 'round');
        polyline.setAttribute('opacity', opacity);
        svg.appendChild(polyline);
      }

      if (tab === 'brulee') {
        drawLine(data.brulee, '#f4741a');
      } else if (tab === 'consommee') {
        drawLine(data.consommee, '#f5301c');
      } else if (tab === 'balance') {
        drawLine(data.brulee, '#f4741a', 0.6);
        drawLine(data.consommee, '#f5301c');
      }
    }

    function switchTab(tab) {
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.tab === tab);
      });
      drawGraph(tab);
    }

    // Initialise
    drawGraph('brulee');
  </script>
</body>
</html>
