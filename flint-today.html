document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

   const vbX = (cx - rect.left) / rect.width * 380;\n    const pts = this.chartPts;\n    let best = pts.length - 1, bd = Infinity;\n    for (let i = 0; i < pts.length; i++) { const d = Math.abs(pts[i].x - vbX); if (d < bd) { bd = d; best = i; } }\n    if (best !== this.state.scrub) this.setState({ scrub: best });\n  }\n\n  segStyle(id) {\n    const active = this.state.trendsPeriod === id;\n    return 'flex: 1; text-align: center; padding: 11px 0; border-radius: 14px; font-family: -apple-system, system-ui, sans-serif; font-size: 16px; font-weight: 600; cursor: pointer; letter-spacing: 0.01em; transition: all .2s ease; '\n      + (active\n        ? 'background: #ffffff; color: #ff4a1c; border: 1.4px solid #ff4a1c; box-shadow: 0 2px 8px rgba(255,74,28,0.12);'\n        : 'background: transparent; color: #8a8378; border: 1.4px solid transparent;');\n  }\n\n  componentDidMount() {\n    const sec = document.getElementById('screen-tableau');\n    if (!sec) return;\n    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;\n    const title = sec.querySelector('a');\n    const wrap = sec.querySelector(':scope > div:last-of-type');\n    const cards = wrap ? Array.from(wrap.children) : [];\n    const targets = [title].concat(cards).filter(Boolean);\n    if (!targets.length) return;\n    targets.forEach(el => { el.style.opacity = '0'; el.style.willChange = 'opacity, transform'; });\n    const io = new IntersectionObserver((ents) => {\n      ents.forEach(e => {\n        if (e.isIntersecting) {\n          targets.forEach((el, i) => {\n            el.style.animation = 'flintTabReveal .62s cubic-bezier(.22,1,.36,1) ' + (i * 80) + 'ms both';\n          });\n          io.disconnect();\n        }\n      });\n    }, { threshold: 0.14 });\n    io.observe(sec);\n  }\n\n  componentDidUpdate(prevProps, prevState) {\n    if (this.state.pickerOpen && !prevState.pickerOpen) {\n      const th = this.state.tempH, tm = this.state.tempM;\n      const doScroll = () => {\n        if (this._colH) this._colH.scrollTop = th * 44;\n        if (this._colM) this._colM.scrollTop = tm * 44;\n      };\n      requestAnimationFrame(() => { doScroll(); requestAnimationFrame(doScroll); });\n    }\n  }\n\n  renderVals() {\n    const soft = { bg: '#fdf3ee', shadow: 'none', labelColor: '#8B8B90', dotBg: '#f5a883', dotBorder: 'none', checked: true };\n    const done = (label) => ({ ...soft, label });\n    const days = [\n      done('LUN'), done('MAR'), done('MER'), done('JEU'), done('VEN'),\n      { label: 'SAM', bg: '#fdf3ee', shadow: 'none', labelColor: '#8B8B90', dotBg: '#ffffff', dotBorder: '2px solid #e2e2e6', checked: false },\n      { label: 'DIM', bg: 'linear-gradient(180deg, #fff4ef 0%, #ffffff 55%)', shadow: '0 0 0 1px #ffb499, 0 3px 11px rgba(255,74,28,0.09)', labelColor: '#ff4a1c', dotBg: '#ff4a1c', dotBorder: 'none', checked: true },\n    ];\n\n    const a = this.state.answers;\n    const pick = (id, v) => this.setState(s => ({ answers: { ...s.answers, [id]: v } }));\n    const base = 'width:54px;height:54px;border-radius:50%;background:#ffffff;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;font-family:-apple-system,system-ui,sans-serif;transition:all .15s ease;padding:0;';\n    const neutral = 'border:1.4px solid #e3ddd2;color:#3a3a3e;font-weight:500;';\n    const checked = 'border:1.2px solid #ffbfa8;color:#ff7a5c;font-weight:600;box-shadow:0 0 0 5px rgba(255,138,90,0.05), 0 4px 14px rgba(255,122,92,0.10);';\n    const nonStyle = (id) => base + (a[id] === 'non' ? checked : neutral);\n    const ouiStyle = (id) => base + (a[id] === 'oui' ? checked : neutral);\n\n    const journal = {};\n    ['avion', 'alcool', 'cafeine', 'diner'].forEach(id => {\n      const cap = id.charAt(0).toUpperCase() + id.slice(1);\n      journal[id + 'NonS'] = nonStyle(id);\n      journal[id + 'OuiS'] = ouiStyle(id);\n      journal[id + 'Non'] = () => pick(id, 'non');\n      journal[id + 'Oui'] = () => pick(id, 'oui');\n    });\n\n    const pad = (n) => String(n).padStart(2, '0');\n    const hoursList = Array.from({ length: 24 }, (_, i) => ({ label: pad(i), color: i === this.state.tempH ? '#14110f' : '#cbc4b8', weight: i === this.state.tempH ? 700 : 500 }));\n    const minsList = Array.from({ length: 60 }, (_, i) => ({ label: pad(i), color: i === this.state.tempM ? '#14110f' : '#cbc4b8', weight: i === this.state.tempM ? 700 : 500 }));\n\n    return {\n      journalY: this.state.journalOpen ? '0%' : '100%',\n      journalPE: this.state.journalOpen ? 'auto' : 'none',\n      openJournal: () => this.setState({ journalOpen: true }),\n      closeJournal: () => this.setState({ journalOpen: false, pickerOpen: false }),\n      saving: this.state.saving,\n      saveJournal: () => {\n        if (this.state.saving) return;\n        this.setState({ saving: true, pickerOpen: false });\n        clearTimeout(this._saveT);\n        this._saveT = setTimeout(() => this.setState({ saving: false, journalOpen: false }), 1500);\n      },\n      showCards: this.props.showCards !== false,\n      glowName: this.props.pulse === false ? 'none' : 'glow',\n      days,\n      heure: this.state.heure,\n      heureLabel: this.state.heure || '--:--',\n      heureColor: this.state.heure ? '#14110f' : '#c9c2b6',\n      pickerOpen: this.state.pickerOpen,\n      hoursList,\n      minsList,\n      colH: (el) => { this._colH = el; },\n      colM: (el) => { this._colM = el; },\n      stop: (e) => e.stopPropagation(),\n      openPicker: () => {\n        let th = 22, tm = 0;\n        const m = /^(\\d{1,2}):(\\d{2})$/.exec(this.state.heure || '');\n        if (m) { th = Math.min(23, +m[1]); tm = Math.min(59, +m[2]); }\n        this.setState({ pickerOpen: true, tempH: th, tempM: tm });\n      },\n      closePicker: () => this.setState({ pickerOpen: false }),\n      confirmPicker: () => this.setState(s => ({ pickerOpen: false, heure: pad(s.tempH) + ':' + pad(s.tempM) })),\n      onScrollH: (e) => {\n        const idx = Math.max(0, Math.min(23, Math.round(e.target.scrollTop / 44)));\n        if (idx !== this.state.tempH) this.setState({ tempH: idx });\n      },\n      onScrollM: (e) => {\n        const idx = Math.max(0, Math.min(59, Math.round(e.target.scrollTop / 44)));\n        if (idx !== this.state.tempM) this.setState({ tempM: idx });\n      },\n      savedCount: Object.values(a).filter(Boolean).length,\n      ...journal,\n      ...(() => {\n        const o = this.state.open;\n        const soft = 'none';\n        const glow = '0 0 0 1px rgba(255,74,28,0.16), 0 12px 34px rgba(255,74,28,0.07)';\n        const sh = (v) => v ? glow : soft;\n        const rot = (v) => v ? 'rotate(180deg)' : 'rotate(0deg)';\n        const bg = (v) => v ? 'linear-gradient(#ffffff,#ffffff) padding-box, linear-gradient(180deg, rgba(255,74,28,0.13) 0%, rgba(255,74,28,0.9) 50%, rgba(255,74,28,0.13) 100%) border-box' : '#ffffff';\n        const bw = (v) => v ? '0 0 0 2px' : '0';\n        return {\n          menuOpen: this.state.menu,\n          toggleMenu: () => this.setState(s => ({ menu: !s.menu })),\n          oRec: o.rec, oSom: o.som, oAct: o.act, oCar: o.car, oCor: o.cor,\n          shRec: sh(o.rec), shSom: sh(o.som), shAct: sh(o.act), shCar: sh(o.car), shCor: sh(o.cor),\n          bgRec: bg(o.rec), bgSom: bg(o.som), bgAct: bg(o.act), bgCar: bg(o.car), bgCor: bg(o.cor),\n          bwRec: bw(o.rec), bwSom: bw(o.som), bwAct: bw(o.act), bwCar: bw(o.car), bwCor: bw(o.cor),\n          cRec: rot(o.rec), cSom: rot(o.som), cAct: rot(o.act), cCar: rot(o.car), cCor: rot(o.cor),\n          tRec: () => this.togCard('rec'), tSom: () => this.togCard('som'), tAct: () => this.togCard('act'), tCar: () => this.togCard('car'), tCor: () => this.togCard('cor'),\n          trendsY: this.state.trends ? '0' : '100%',\n          trendsPE: this.state.trends ? 'auto' : 'none',\n          openTrends: () => this.setState({ trends: true }),\n          closeTrends: () => this.setState({ trends: false }),\n          period: this.state.trendsPeriod,\n          setPerS: () => this.setState({ trendsPeriod: 'S' }),\n          setPerM: () => this.setState({ trendsPeriod: 'M' }),\n          setPer6: () => this.setState({ trendsPeriod: '6M' }),\n          segS: this.segStyle('S'), segM: this.segStyle('M'), seg6: this.segStyle('6M'),\n          ...(() => {\n            const p = this.chartPts[this.state.scrub] || this.chartPts[this.chartPts.length - 1];\n            return {\n              mx: p.x, my: p.y, mval: String(p.v),\n              labelX: p.x + 15, labelY: p.y + 7,\n              guideX: p.x, guideOp: this.state.scrubbing ? 0.4 : 0,\n              scrubbing: this.state.scrubbing,\n              onScrubDown: (e) => { this.setState({ scrubbing: true }); this.scrubAt(e); },\n              onScrubMove: (e) => { if (this.state.scrubbing) { if (e.preventDefault) e.preventDefault(); this.scrubAt(e); } },\n              onScrubUp: () => this.setState({ scrubbing: false }),\n            };\n          })(),\n        };\n      })(),\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
